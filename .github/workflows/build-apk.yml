name: Build and Release Feedbrake APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Capture Failure Log if Failed
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-error-log
          tail -n 300 gradle-build.log > ERROR.txt
          git add ERROR.txt
          git commit -m "Capture build failure error"
          git push -f origin build-error-log

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/Feedbrake-v1.0.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feedbrake-debug-apk
          path: release-apk/Feedbrake-v1.0.0-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Feedbrake v1.0.0 (Release APK)
          body: |
            ## 🛑 Feedbrake v1.0.0 - Android APK Release
            
            ### ✨ What's Inside:
            - **🏝️ Dynamic Island Live Overlay**: Anchors around your camera punch-hole with live reel count and micro spring animations.
            - **📱 Multi-Platform Reel Detection**: Tracks Instagram Reels, TikTok, YouTube Shorts, and Facebook Reels.
            - **🏠 Jetpack Glance Home Screen Widget**: Material 3 widget for your home screen.
            - **⚡ OLED Dark Mode Dashboard**: Animated progress dial, dopamine danger levels, and platform breakdown.
            
            ---
            ### 📥 Download & Install:
            Download the `Feedbrake-v1.0.0-debug.apk` asset below and install it directly on your Android phone (Android 9.0+).
          draft: false
          prerelease: false
          files: release-apk/Feedbrake-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
