name: Build and Release Feedbrake APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Save Build Log on Failure
        if: failure()
        run: |
          echo "=== BUILD FAILED. Pushing log to build-logs branch ==="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add gradle-build.log
          git commit -m "Log for failed build [skip ci]" || true
          git push origin build-logs --force || true

      - name: Locate and Prepare APK
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" release-apk/Feedbrake-v1.0.1-debug.apk
          ls -la release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feedbrake-debug-apk
          path: release-apk/Feedbrake-v1.0.1-debug.apk

      - name: Push APK to Download Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-download
          cp release-apk/Feedbrake-v1.0.1-debug.apk ./Feedbrake-v1.0.1-debug.apk
          git add Feedbrake-v1.0.1-debug.apk
          git commit -m "Release Feedbrake v1.0.1 APK [skip ci]" || true
          git push origin apk-download --force || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Feedbrake v1.0.1"
          body: |
            ## Feedbrake v1.0.1 - Android APK Release

            ### Features:
            - **Dynamic Island Live Overlay**: Anchors around your camera punch-hole with live reel count and micro spring animations.
            - **Multi-Platform Reel Detection**: Tracks Instagram Reels, TikTok, YouTube Shorts, and Facebook Reels.
            - **Jetpack Glance Home Screen Widget**: Material 3 widget for your home screen.
            - **OLED Dark Mode Dashboard**: Animated progress dial, dopamine danger levels, and platform breakdown.

            ---
            ### Download & Install:
            Download the **Feedbrake-v1.0.1-debug.apk** below and install it directly on your Android phone (Android 9.0+).
          draft: false
          prerelease: false
          files: release-apk/Feedbrake-v1.0.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
